name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pi itself requires Node >=22.19.0 (it uses fs.globSync), so the
        # package floor tracks that. Testing 20 here would only fail on a
        # version this package never claimed to support.
        node: ["22"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The fast suites are platform-independent (decision table, settings
      # layering, notifications, malformed input). They are the core logic and
      # take about a second.
      - name: Run tests
        run: npm test

  # The e2e suite drives Pi's real bash tool and kills real processes, then
  # inspects the process table via WMI to prove no grandchildren survive. That
  # is Windows-specific and takes ~2 minutes, so it runs separately and does not
  # gate every push. It is expected to need porting before it can run on Linux.
  e2e:
    name: e2e (windows)
    # The e2e harness inspects the process table with WMI, so it is
    # Windows-only for now.
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run e2e suite
        run: npm run test:e2e
