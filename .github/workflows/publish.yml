name: Publish

# Publishes to npm via OIDC trusted publishing: there is no NPM_TOKEN secret,
# and the credential is a short-lived token minted by GitHub for this exact repo
# + workflow file. The trusted publisher configured on npmjs.com must name THIS
# file (`publish.yml`) and this repository (`wjunhere/pi-smart-timeout`).
#
# Triggers:
#   - pushing a version tag: tests run, then the version is published
#   - manual dispatch: defaults to a dry run, so it is safe to click

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run instead of publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (oidc)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required by npm trusted publishing: lets the runner request an OIDC
      # token that npm exchanges for a short-lived publish credential.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # Do not cache .npm here: this job must not depend on token auth.
          package-manager-cache: false

      - name: Use a trusted-publishing capable npm
        # OIDC publishing landed in npm 11.5.1; the version bundled with Node 22
        # may be older.
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on v$pkg"

      - name: Test
        run: npm test

      - name: Check whether this version is already on npm
        id: check
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "pi-smart-timeout@$pkg" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$pkg is already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Tag pushes publish for real; a manual dispatch dry-runs by default.
      - name: Publish (tag push)
        if: steps.check.outputs.exists == 'false' && !inputs.dry-run
        run: npm publish --provenance --access public

      - name: Publish dry run (manual dispatch)
        if: steps.check.outputs.exists == 'false' && inputs.dry-run
        run: npm publish --dry-run
